name: Build All 7 XGPS Licenses

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build 7 XGPS License Dylibs
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          brew install ldid || true

      - name: Compile 7 Universal Dylibs
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build_output
          
          build_sec() {
            SECS=$1
            KEYCHAIN=$2
            NAME=$3
            echo "==> Compiling $NAME (SECS=$SECS, KEYCHAIN=$KEYCHAIN)"
            xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e               -isysroot $SDK -miphoneos-version-min=14.0               -fobjc-arc -framework UIKit -framework Security -framework Foundation               -DTRIAL_SECONDS=$SECS -DUSE_KEYCHAIN=$KEYCHAIN               xgps/XGPSLicense.m -o build_output/$NAME.dylib
            ldid -S build_output/$NAME.dylib || codesign -s - build_output/$NAME.dylib
          }

          # 1. 6 Tiếng Soft (6 * 3600 = 21600s)
          build_sec 21600.0 0 XGPSLicense_6H_Soft
          # 2. 1 Tháng Soft (30 * 86400 = 2592000s)
          build_sec 2592000.0 0 XGPSLicense_1M_Soft
          # 3. 3 Tháng Soft (90 * 86400 = 7776000s)
          build_sec 7776000.0 0 XGPSLicense_3M_Soft
          # 4. 6 Tháng Soft (180 * 86400 = 15552000s)
          build_sec 15552000.0 0 XGPSLicense_6M_Soft
          # 5. 1 Tháng Hard Keychain
          build_sec 2592000.0 1 XGPSLicense_1M_Hard
          # 6. 3 Tháng Hard Keychain
          build_sec 7776000.0 1 XGPSLicense_3M_Hard
          # 7. 6 Tháng Hard Keychain
          build_sec 15552000.0 1 XGPSLicense_6M_Hard

          ls -lh build_output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgps-all-7-dylibs
          path: build_output/*.dylib
