name: Build XGPS Licenses

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build XGPS License Dylibs
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          brew install ldid || true

      - name: Compile Universal Dylibs
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build_output
          
          build_variant_sec() {
            SECS=$1
            KEYCHAIN=$2
            NAME=$3
            echo "==> Compiling $NAME (TRIAL_SECONDS=$SECS, USE_KEYCHAIN=$KEYCHAIN)"
            xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e               -isysroot $SDK -miphoneos-version-min=14.0               -fobjc-arc -framework UIKit -framework Security -framework Foundation               -DTRIAL_SECONDS=$SECS -DUSE_KEYCHAIN=$KEYCHAIN               xgps/XGPSLicense.m -o build_output/$NAME.dylib
            ldid -S build_output/$NAME.dylib || codesign -s - build_output/$NAME.dylib
          }

          # 6 tiếng = 21600 giây
          build_variant_sec 21600.0 0 XGPSLicense_6H_Soft

          ls -lh build_output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgps-6h-dylib
          path: build_output/*.dylib
