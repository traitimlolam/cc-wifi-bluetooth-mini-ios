name: Build CCWiFiAndBT DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/CCWiFiAndBT_v1.0.3_iPhone13mini_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.3
          name: CC Wi-Fi & Bluetooth Độc Lập v1.0.3 (Icon Gốc Nhỏ Gọn Chuẩn Tỉ Lệ Cho iPhone 13 mini)
          body: |
            ### 🎛️ 2 Nút Wi-Fi & Bluetooth Độc Lập v1.0.3 (iPhone 13 mini)
            - **Icon gốc chuẩn hệ thống:** Sử dụng trực tiếp biểu tượng gốc của hệ thống máy đời này (`wifi` và `bluetooth`), không dùng icon thô.
            - **Tỉ lệ thanh mảnh, đồng bộ:** Kích thước icon nhỏ gọn vừa vặn đúng tỉ lệ như các nút xung quanh (Khóa xoay, Chuông im lặng, Đèn pin, Hẹn giờ).
            - **Khóa model:** Dành riêng duy nhất cho iPhone 13 mini (`iPhone14,4`).
          files: output/*.deb
