name: Build CCWiFiAndBT DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/CCWiFiAndBT_v1.0.5_iPhone13mini_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.5
          name: CC Wi-Fi & Bluetooth Độc Lập v1.0.5 (Chế Độ Ngắt Kết Nối Chuẩn Gốc Cho iPhone 13 mini)
          body: |
            ### 🎛️ 2 Nút Wi-Fi & Bluetooth Độc Lập v1.0.5 (iPhone 13 mini)
            - **Chế độ ngắt kết nối chuẩn gốc (Native Disconnect):** Khi bấm vào nút Wi-Fi, máy sẽ ngắt kết nối với mạng Wi-Fi hiện tại (chuyển sang màu kính mờ) chứ KHÔNG tắt hẳn chip Wi-Fi trong Cài đặt.
            - **Icon Cài đặt chuẩn Squircle:** Không bị lỗi lưới placeholder.
            - **Icon Control Center thanh mảnh:** Tỉ lệ compact 0.65 nhỏ gọn đồng bộ với các nút xung quanh.
            - **Khóa model:** Duy nhất cho iPhone 13 mini (`iPhone14,4`).
          files: output/*.deb
