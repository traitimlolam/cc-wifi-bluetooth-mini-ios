name: Build CCWiFiAndBT DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/CCWiFiAndBT_v1.0.8_iPhone13mini_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.8
          name: CC Wi-Fi & Bluetooth Độc Lập v1.0.8 (iPhone 13 mini - iOS 15.6.1 RootHide)
          body: |
            ### 🎛️ 2 Nút Wi-Fi & Bluetooth Độc Lập cho Control Center (iPhone 13 mini iOS 15.6.1 RootHide)
            - **Icon Wi-Fi:** Tỉ lệ scale 1.0 chuẩn cân đối.
            - **Chuẩn gốc Apple:** Bấm ngắt kết nối (giữ chip Wi-Fi bật trong Cài đặt), bấm lại kết nối ngay.
            - **Độ mượt mà:** Kích hoạt trực tiếp chu trình nút thật, tuyệt đối không đơ, không treo máy, không tự respring.
          files: output/*.deb
