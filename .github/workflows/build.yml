name: Build CCWiFiAndBT DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/CCWiFiAndBT_v1.0.4_iPhone13mini_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.4
          name: CC Wi-Fi & Bluetooth Độc Lập v1.0.4 (Full Native Icons Cho iPhone 13 mini)
          body: |
            ### 🎛️ 2 Nút Wi-Fi & Bluetooth Độc Lập v1.0.4 (iPhone 13 mini)
            - **Icon Cài đặt chuẩn Squircle:** Hiển thị icon vuông bo góc nền xanh Apple với biểu tượng trắng ở giữa (hết lỗi lưới placeholder).
            - **Tên hiển thị chuẩn:** Đổi tên hiển thị từ WiFiToggleModule -> "Wi-Fi", BluetoothToggleModule -> "Bluetooth".
            - **Icon Control Center thanh mảnh:** Tỉ lệ compact 0.65 nhỏ gọn đồng bộ với toàn bộ các nút xung quanh.
          files: output/*.deb
